*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#f5ede0;color:#1a1a1a;min-height:100vh}
:root{

}
.btn{font-family:inherit;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:700;border:1px solid var(--border);background:#fff;color:#1a1a1a;transition:opacity .15s}
.btn:hover{opacity:.8}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-danger{background:#fee2e2;color:var(--red);border-color:#fca5a5}
.btn-green{background:#dcfce7;color:var(--green);border-color:#86efac}
.btn-warn{background:#fffbeb;color:#b45309;border-color:#fcd34d}
.inp{border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:13px;background:#fff;color:#1a1a1a;font-family:inherit;width:100%;outline:none}
.inp:focus{border-color:var(--gold)}
.lbl{font-size:11px;color:var(--muted);margin-bottom:4px;display:block;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px}
#login-screen{min-height:100vh;background:linear-gradient(rgba(18,36,64,.86),rgba(18,36,64,.93)),url('https://storage1.snappages.site/GKKB9P/assets/images/22750931_1920x1080_500.png') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(255,255,255,.97);border-radius:20px;padding:36px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:100%;max-width:420px}
.login-divider{height:3px;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:2px;width:60px;margin:0 auto 14px}
.login-title{font-size:20px;font-weight:900;color:var(--navy);text-align:center;letter-spacing:-.5px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px}
.login-error{background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:9px 12px;font-size:12px;color:var(--red);margin-bottom:14px;font-weight:700}

#app-screen{display:none;flex-direction:column;min-height:100vh}

.nav-div{width:1px;height:26px;background:rgba(255,255,255,.2);flex-shrink:0}
.nav-title{flex:1;color:#fff;font-size:14px;font-weight:700;min-width:0}
.nav-sub{font-size:11px;color:rgba(255,255,255,.45);margin-right:4px}
.nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:11px;padding:5px 10px}
.save-chip{font-size:11px;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--cream);font-weight:700}
.hero{background:linear-gradient(135deg,var(--navy),var(--navyD));padding:18px 20px 0;position:relative;overflow:hidden}

.hero-label{color:rgba(255,255,255,.6);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.hero-title{color:#fff;font-size:21px;font-weight:900;letter-spacing:-.4px;margin-bottom:14px}
.tab-bar{display:flex;overflow-x:auto}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.5);padding:8px 16px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.13)}
.sub-tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.sub-tab{background:none;border:none;border-bottom:3px solid transparent;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--muted);margin-bottom:-2px;white-space:nowrap}
.sub-tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.content{padding:18px 20px 40px;flex:1}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
.metric-val{font-size:20px;font-weight:900;letter-spacing:-.5px}
.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.event-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;border-top-width:3px}
.type-pill{display:inline-block;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:700;letter-spacing:.03em;margin-bottom:6px}
.ec-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;margin:8px 0 10px}
.ec-stat-label{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase}
.ec-stat-val{font-weight:700}
.ec-actions{display:flex;gap:5px;border-top:1px solid var(--sand);padding-top:8px}
.ec-actions .btn{flex:1;justify-content:center;font-size:11px;padding:4px 6px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:700;color:var(--muted);padding:5px 8px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
th.r{text-align:right}
td{padding:6px 8px;border-bottom:1px solid var(--sand)}
td.r{text-align:right}
tr:hover td{background:var(--cream);cursor:pointer}
.backdrop{position:fixed;inset:0;background:rgba(18,36,64,.58);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:20px 16px}
.modal{background:#fff;border-radius:16px;border:1px solid var(--border);width:100%;max-width:680px;padding:20px 22px}
.modal-sm{max-width:400px;text-align:center}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:3px solid var(--gold)}
.modal-eyebrow{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.modal-title{font-size:18px;font-weight:900;color:var(--navy);margin:0;letter-spacing:-.3px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-top:18px;margin-bottom:8px;padding-top:14px;border-top:1px solid var(--border)}
.section-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.prow{display:grid;grid-template-columns:1fr 1fr 80px 2fr 80px 55px 22px;gap:5px;align-items:center;margin-bottom:5px}
.vrow{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 22px;gap:6px;align-items:center;margin-bottom:7px}
.offer-row{display:flex;align-items:center;gap:8px}
.offer-label{font-size:11px;color:var(--muted);font-weight:700;width:60px;flex-shrink:0}
.detail-block{background:var(--cream);border-radius:10px;padding:14px 16px;border:1px solid var(--border)}
.detail-block-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

.backup-item{background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;transition:all .15s;margin-bottom:14px}

let events=[],backups=[],currentUsername="",currentEventId=null,activeTab="overview",activeDetailTab="summary",editingEvent=null;

function eventToRow(e){
  return {
    id:e.id, name:e.name, date:e.date, type:e.type, menu:e.menu||null,
    attendance:e.attendance||{adults:0,children:0,kidsMeals:0},
    financials:e.financials||{totalCost:0,totalOffering:0,totalIncome:0},
    purchases:e.purchases||[], offering:e.offering||emptyOffer(), volunteers:e.volunteers||[]
  };
}
function rowToEvent(r){
  return {
    id:r.id, name:r.name, date:r.date, type:r.type, menu:r.menu||"",
    attendance:r.attendance||{adults:0,children:0,kidsMeals:0},
    financials:r.financials||{totalCost:0,totalOffering:0,totalIncome:0},
    purchases:r.purchases||[], offering:r.offering||emptyOffer(), volunteers:r.volunteers||[]
  };
}

async function loadBackupsOnly(){
  try{
    const {data,error}=await sb.from('backups').select('*').order('created_at',{ascending:false}).limit(10);
    if(error)throw error;
    backups=(data||[]).map(r=>({
      dbId:r.id,
      name:r.name,
      date:new Date(r.created_at).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}),
      eventCount:r.event_count,
      size:r.size_label,
      payload:JSON.stringify(r.payload)
    }));
  }catch(err){console.error("loadBackupsOnly",err);backups=[];}
}

async function loadAll(){
  if(!SUPABASE_CONFIGURED){
    showConfigError();
    events=JSON.parse(JSON.stringify(SEED));backups=[];
    return;
  }
  try{
    const {data,error}=await sb.from('events').select('*').order('date',{ascending:true});
    if(error)throw error;
    if(data&&data.length){
      events=data.map(rowToEvent);
    }else{
      events=JSON.parse(JSON.stringify(SEED));
      await saveAll();
    }
  }catch(err){
    console.error("loadAll",err);
    events=JSON.parse(JSON.stringify(SEED));
    setSaveStatus("error");
  }
  await loadBackupsOnly();
}

async function saveAll(){
  setSaveStatus("saving");
  try{
    if(events.length){
      const {error:upErr}=await sb.from('events').upsert(events.map(eventToRow));
      if(upErr)throw upErr;
    }
    const {data:existingRows,error:selErr}=await sb.from('events').select('id');
    if(selErr)throw selErr;
    const localIds=new Set(events.map(e=>e.id));
    const toDelete=(existingRows||[]).map(r=>r.id).filter(id=>!localIds.has(id));
    if(toDelete.length){
      const {error:delErr}=await sb.from('events').delete().in('id',toDelete);
      if(delErr)throw delErr;
    }
    setSaveStatus("saved");setTimeout(()=>setSaveStatus("idle"),2000);
  }catch(err){
    console.error("saveAll",err);
    setSaveStatus("error");
  }
}

function showConfigError(){
  const err=document.getElementById("login-error");
  if(!err)return;
  err.innerHTML="Supabase isn't configured yet — edit this file and set <strong>SUPABASE_URL</strong> and <strong>SUPABASE_ANON_KEY</strong> near the top of the &lt;script&gt; tag.";
  err.style.display="block";
}

function setSaveStatus(s){
  const el=document.getElementById("save-chip");if(!el)return;
  const m={idle:["#aaa","&#9729; Auto-save on"],saving:["#d97706","&#8593; Saving…"],saved:[C.green,"&#10003; Saved"],error:[C.red,"&#10005; Error"]};
  const cfg=m[s]||m.idle;el.style.color=cfg[0];el.style.borderColor=cfg[0]+"44";el.innerHTML=cfg[1];
}

let toastTimer=null;

}

function renderOverview(){
  const tc=events.reduce((s,e)=>s+e.financials.totalCost,0);
  const to=events.reduce((s,e)=>s+e.financials.totalOffering,0);
  const ti=events.reduce((s,e)=>s+e.financials.totalIncome,0);
  const ta=events.reduce((s,e)=>s+tA(e),0);
  const wA=events.filter(e=>tA(e)>0);
  const avg=wA.length?Math.round(wA.reduce((s,e)=>s+tA(e),0)/wA.length):0;
  const neg=events.filter(e=>e.financials.totalIncome<0).length;
  const pos=events.filter(e=>e.financials.totalIncome>=0).length;
  const ic=ti>=0?C.green:C.red;
  const cP=ta>0?"$"+(tc/ta).toFixed(2):"—";
  const stats=[["Events",events.length,C.navy],["Attendance",ta.toLocaleString(),C.navy],["Avg attend.",avg,C.navy],["Total cost",fC(tc),C.navy],["Cost/person",cP,C.navy],["Total offering",fC(to),C.navy],["Net income",fCS(ti),ic],["Profitable",pos,C.green],["Over budget",neg,C.red]];
  const sorted=[...events].sort((a,b)=>gMs(b)-gMs(a)).slice(0,10);
  let rows=sorted.map(e=>{const c=e.financials.totalIncome>=0?C.green:C.red;return`<tr onclick="showDetail(${e.id})"><td>${e.name}</td><td style="color:var(--muted);font-size:11px">${fD(e.date)}</td><td>${typePill(e.type)}</td><td class="r">${tA(e)||"—"}</td><td class="r">${fC(e.financials.totalCost)}</td><td class="r" style="font-weight:700;color:${c}">${fCS(e.financials.totalIncome)}</td></tr>`;}).join("");
  document.getElementById("panel-overview").innerHTML=`
    <div class="metric-grid">${stats.map(s=>`<div class="metric" style="border-top:3px solid ${s[2]}"><div class="metric-label">${s[0]}</div><div class="metric-val" style="color:${s[2]}">${s[1]}</div></div>`).join("")}</div>
    <div class="card"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Recent events</div>
    <div style="overflow-x:auto"><table style="min-width:460px"><thead><tr><th>Event</th><th>Date</th><th>Type</th><th class="r">Attend.</th><th class="r">Cost</th><th class="r">Net</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function typePill(t){return`<span class="type-pill" style="background:${typeBg(t)};color:${typeColor(t)}">${t}</span>`;}

let evFilter="",evType="All";
function renderEvents(){

  if(types[0]!=="All")types.unshift("All");
  const filtered=events.filter(e=>{
    const tm=evType==="All"||e.type===evType;
    const sm=!evFilter||e.name.toLowerCase().includes(evFilter.toLowerCase())||(e.menu||"").toLowerCase().includes(evFilter.toLowerCase());
    return tm&&sm;
  }).sort((a,b)=>gMs(b)-gMs(a));
  const opts=types.map(t=>`<option value="${t}"${t===evType?" selected":""}>${t}</option>`).join("");
  const cards=filtered.map(e=>{const ic=e.financials.totalIncome>=0?C.green:C.red;return`
    <div class="event-card" style="border-top-color:${typeColor(e.type)}">
      <div style="font-size:13px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.name}</div>

        <div><div class="ec-stat-label">Offering</div><div class="ec-stat-val">${fC(e.financials.totalOffering)}</div></div>

        <button class="btn" onclick="showDetail(${e.id})">&#128065; View</button>

function renderCharts(){
  const byType={};events.forEach(e=>{byType[e.type]=(byType[e.type]||0)+1;});
  const total=Object.values(byType).reduce((s,v)=>s+v,0);
  const typeCards=Object.entries(byType).map(([t,v])=>`
    <div style="display:flex;align-items:center;gap:10px;background:${typeBg(t)};border-radius:10px;padding:10px 14px;flex:1;min-width:130px;border:1px solid var(--border)">
      <div style="width:4px;height:36px;border-radius:2px;background:${typeColor(t)};flex-shrink:0"></div>
      <div><div style="font-weight:900;font-size:22px;letter-spacing:-.5px;color:${typeColor(t)}">${v}</div><div style="font-size:11px;color:var(--muted);font-weight:700">${t} &middot; ${Math.round(v/total*100)}%</div></div>
    </div>`).join("");
  const sorted12=[...events].filter(e=>e.date).sort((a,b)=>gMs(a)-gMs(b)).slice(-12);
  const mx=Math.max(...sorted12.map(e=>Math.max(e.financials.totalCost,e.financials.totalOffering)),1);
  const barRows=sorted12.map(e=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span style="font-weight:700">${e.name.length>22?e.name.slice(0,22)+"…":e.name}</span>
        <span style="color:var(--muted)">${fC(e.financials.totalCost)} &middot; ${fC(e.financials.totalOffering)}</span>
      </div>
      <div style="height:7px;background:var(--sand);border-radius:4px;margin-bottom:2px"><div style="height:100%;width:${(e.financials.totalCost/mx*100).toFixed(1)}%;background:${C.red};border-radius:4px"></div></div>
      <div style="height:7px;background:var(--sand);border-radius:4px"><div style="height:100%;width:${(e.financials.totalOffering/mx*100).toFixed(1)}%;background:${C.green};border-radius:4px"></div></div>
    </div>`).join("");
  const monthly={};events.forEach(e=>{if(!e.date)return;const m=new Date(e.date+"T12:00:00").toLocaleDateString("en-US",{month:"short"});monthly[m]=(monthly[m]||0)+tA(e);});
  const mxA=Math.max(...Object.values(monthly),1);

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:10px;color:var(--muted);font-weight:700">${v}</div>
      <div style="width:100%;height:${Math.round(v/mxA*90)}px;background:var(--navy);border-radius:3px 3px 0 0;min-height:2px"></div>
      <div style="font-size:9px;color:var(--muted);font-weight:600">${m}</div>
    </div>`).join("");
  document.getElementById("panel-charts").innerHTML=`
    <div class="card" style="margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Events by type</div><div style="display:flex;flex-wrap:wrap;gap:8px">${typeCards}</div></div>
    <div class="card" style="margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px">Cost vs offering — recent 12</div>${barRows}<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted);font-weight:700"><span>&#9632; <span style="color:${C.red}">Cost</span></span><span>&#9632; <span style="color:${C.green}">Offering</span></span></div></div>
    <div class="card"><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px">Attendance by month</div><div style="display:flex;align-items:flex-end;gap:6px;height:110px">${attBars}</div></div>`;
}

  const ofRows=ofFields.map(([l,k])=>`<div class="offer-row"><label class="offer-label">${l}</label><input class="inp" style="width:90px" type="number" step="0.01" value="${(e.offering||{})[k]||0}" onchange="editingEvent.offering['${k}']=parseFloat(this.value)||0;updateFormTotals()"></div>`).join("");

      <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:700"><input type="checkbox"${v.kitchenEvent?" checked":""} onchange="editingEvent.volunteers[${i}].kitchenEvent=this.checked"> KTCHN Event</label>

      <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:700"><input type="checkbox"${v.hospEvent?" checked":""} onchange="editingEvent.volunteers[${i}].hospEvent=this.checked"> HSPTLY Event</label>

function updateFormTotals(){
  const cd=document.getElementById("cost-disp"),od=document.getElementById("offer-disp");
  if(cd)cd.textContent=fC(calcCost(editingEvent));
  if(od)od.textContent=fC(offerTotal(editingEvent.offering||emptyOffer()));
}

function addPurch(){editingEvent.purchases.push({vendor:"",purchasedBy:"",description:"",debit:0,credit:0});renderForm();}
function rmPurch(i){editingEvent.purchases.splice(i,1);renderForm();}
function addVol(){if(!editingEvent.volunteers)editingEvent.volunteers=[];editingEvent.volunteers.push({name:"",kitchenPrep:false,kitchenEvent:false,hospPrep:false,hospEvent:false});renderForm();}
function rmVol(i){editingEvent.volunteers.splice(i,1);renderForm();}


function saveForm(){
  if(!editingEvent.name.trim()){alert("Please enter an event name.");return;}
  const cost=calcCost(editingEvent);
  const offer=offerTotal(editingEvent.offering||emptyOffer());
  editingEvent.financials={totalCost:Math.round(cost*100)/100,totalOffering:Math.round(offer*100)/100,totalIncome:Math.round((offer-cost)*100)/100};
  const idx=events.findIndex(e=>e.id===editingEvent.id);
  if(idx>=0)events[idx]=editingEvent;else events.push(editingEvent);
  const savedId=editingEvent.id;
  closeForm();saveAll();
  if(currentEventId===savedId)showDetail(savedId);else{setTab(activeTab);}
  document.getElementById("tab-events").textContent="Events ("+events.length+")";
  showToast("Event saved");
}

function closeForm(){document.getElementById("form-modal").style.display="none";editingEvent=null;}

        <div class="row sep"><span>Total</span><span>${att||"—"}</span></div>
      </div>
      <div class="sb"><div class="sbt">Financials</div>
        <div class="row"><span>Total Cost</span><span style="color:#b91c1c">${fC(e.financials.totalCost)}</span></div>
        <div class="row"><span>Cost / Person</span><span>${cP}</span></div>
        <div class="row"><span>Total Offering</span><span style="color:#1a6e3c">${fC(e.financials.totalOffering)}</span></div>
        <div class="row"><span>Offering / Person</span><span>${oP}</span></div>
        <div class="row sep"><span>Net Income</span><span style="color:${ic}">${fCS(e.financials.totalIncome)}</span></div>
      </div>
    </div>
  </div>
  ${e.menu?`<div class="sec"><div class="st">Menu</div><div class="menu-box">${e.menu}</div></div>`:''}
  <div class="sec"><div class="st">Purchases</div>
    <table><thead><tr><th>Vendor</th><th>By</th><th>Description</th><th class="r">Debit</th><th class="r">Credit</th><th class="r">Net</th></tr></thead>
    <tbody>${purchRows}</tbody></table>
  </div>
  <div class="sec"><div class="st">Offering Count</div>
    <div class="tg">
      <table><thead><tr><th>Denomination</th><th class="r">Count</th><th class="r">Amount</th></tr></thead><tbody>${offerRows}</tbody></table>
      <table><thead><tr><th>Method</th><th class="r">Count</th><th class="r">Amount</th></tr></thead><tbody>${otherRows}</tbody></table>
    </div>
  </div>
  <div class="sec"><div class="st">Volunteer Schedule</div>
    <table><thead><tr><th>Volunteer</th><th class="c">Kitchen Prep</th><th class="c">Kitchen Event</th><th class="c">Hosp. Prep</th><th class="c">Hosp. Event</th></tr></thead>
    <tbody>${volRows}</tbody></table>
  </div>
  <div class="rf">
    <span>DELC Food &amp; Beverage 2026 — ${e.name}</span>
    <span>Printed ${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</span>
  </div>`;


  overlay.style.display="block";
  document.body.style.overflow="hidden";
  setTimeout(()=>window.print(),300);
}

function closePrintOverlay(){
  document.getElementById("print-overlay").style.display="none";
  document.body.style.overflow="";
}

let deleteTargetId=null;
function askDelete(id){
  deleteTargetId=id;const e=events.find(x=>x.id===id);
  document.getElementById("confirm-inner").innerHTML=`
    <div style="font-size:36px;margin-bottom:12px">⚠️</div>
    <h2 style="font-size:16px;font-weight:900;color:var(--navy);margin-bottom:8px">Delete this event?</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">"${e?e.name:""}" will be permanently removed.</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" onclick="doDelete()">🗑 Delete</button>
    </div>`;
  document.getElementById("confirm-modal").style.display="flex";
}
function closeConfirm(){document.getElementById("confirm-modal").style.display="none";}
function doDelete(){events=events.filter(e=>e.id!==deleteTargetId);closeConfirm();saveAll();showDash();showToast("Event deleted","err");}

function openData(){renderDataModal();document.getElementById("data-modal").style.display="flex";}
function closeData(){document.getElementById("data-modal").style.display="none";}

function renderDataModal(){
  const bItems=backups.length?backups.map((b,i)=>`
    <div class="backup-item">

      <div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--navy)">${b.name}</div><div style="font-size:11px;color:var(--muted)">${b.date} &middot; ${b.eventCount} events &middot; ${b.size}</div></div>
      <div style="display:flex;gap:6px">
        <button class="btn" style="font-size:11px;padding:4px 8px" onclick="dlBackup(${i})">&#8595;</button>
        <button class="btn btn-warn" style="font-size:11px;padding:4px 8px" onclick="restoreBackup(${i})">&#8635; Restore</button>
        <button class="btn btn-danger" style="font-size:11px;padding:4px 8px" onclick="delBackup(${i})">&#10005;</button>
      </div>
    </div>`).join(""):`<p style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0">No backups yet.</p>`;
  document.getElementById("data-inner").innerHTML=`
    <div class="modal-header">
      <div><div class="modal-eyebrow">DELC Food & Beverage</div><h2 class="modal-title">Data & Backups</h2></div>
      <button style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1" onclick="closeData()">×</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="detail-block" style="text-align:center"><div style="font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-1px">${events.length}</div><div style="font-size:11px;color:var(--muted);font-weight:700">Events stored</div></div>
      <div class="detail-block" style="text-align:center"><div style="font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-1px">${backups.length}</div><div style="font-size:11px;color:var(--muted);font-weight:700">Saved backups</div></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn btn-green" onclick="createBackup()">&#128190; Save backup now</button>
      <button class="btn btn-primary" onclick="exportJSON()">&#8595; Export JSON</button>
      <button class="btn" onclick="document.getElementById('file-input').click()">&#8593; Import JSON</button>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Saved backups</div>
      <div style="max-height:260px;overflow-y:auto">${bItems}</div>
    </div>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="handleDrop(event)">
      &#128194; Drop a .json backup file here, or click to browse
    </div>
    <div style="background:var(--cream);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--muted);line-height:1.6;border:1px solid var(--border)">
      Data auto-saves to Supabase and is shared across everyone using this app. Use <strong>Export JSON</strong> for an extra offline copy.
    </div>`;
}


async function createBackup(){
  const payload={events};
  const now=new Date();
  const name="Backup "+now.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" "+now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
  const sizeLabel=fmtSz(JSON.stringify(payload));
  try{
    const {error}=await sb.from('backups').insert({name,event_count:events.length,size_label:sizeLabel,payload});
    if(error)throw error;
    const {data:rows}=await sb.from('backups').select('id').order('created_at',{ascending:false});
    if(rows&&rows.length>10){
      const idsToDelete=rows.slice(10).map(r=>r.id);
      await sb.from('backups').delete().in('id',idsToDelete);
    }
    await loadBackupsOnly();renderDataModal();showToast("Backup saved — "+events.length+" events");
  }catch(err){console.error("createBackup",err);showToast("Backup failed","err");}
}

function dlBackup(i){const blob=new Blob([backups[i].payload],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="delc_fb_backup_"+Date.now()+".json";a.click();}
async function delBackup(i){
  const b=backups[i];
  try{
    if(b.dbId!=null){const {error}=await sb.from('backups').delete().eq('id',b.dbId);if(error)throw error;}
    await loadBackupsOnly();renderDataModal();showToast("Backup deleted","err");
  }catch(err){console.error("delBackup",err);showToast("Delete failed","err");}
}
async function restoreBackup(i){
  if(!confirm('Restore "'+backups[i].name+'"? This replaces all current data.'))return;
  try{const d=JSON.parse(backups[i].payload);events=d.events||[];await saveAll();closeData();showDash();showToast("Restored from backup");}
  catch(err){console.error("restoreBackup",err);showToast("Restore failed","err");}
}

function exportJSON(){
  const p=JSON.stringify({events,exportedAt:new Date().toISOString(),version:"1.0"},null,2);
  const blob=new Blob([p],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="delc_fb_"+new Date().toISOString().split("T")[0]+".json";a.click();
  showToast("Exported all data");
}

function handleImport(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async e=>{
    try{const d=JSON.parse(e.target.result);if(!d.events||!Array.isArray(d.events))throw new Error();if(!confirm("Import "+d.events.length+" events? This replaces current data."))return;events=d.events;await saveAll();closeData();showDash();showToast("Imported "+d.events.length+" events");}
    catch{showToast("Import failed — check file format","err");}
  };

  r.readAsText(file);input.value="";
}

function handleDrop(e){
  e.preventDefault();document.getElementById("drop-zone").classList.remove("over");
  const file=e.dataTransfer.files[0];
  if(!file||!file.name.endsWith(".json")){showToast("Please drop a .json file","err");return;}
  const r=new FileReader();
  r.onload=async ev=>{
    try{const d=JSON.parse(ev.target.result);if(!d.events)throw new Error();if(!confirm("Import "+d.events.length+" events?"))return;events=d.events;await saveAll();closeData();showDash();showToast("Imported "+d.events.length+" events");}
    catch{showToast("Import failed","err");}
  };
  r.readAsText(file);
}

(async function(){await loadAll();setTab("overview");})();
</script>
</body>
</html>
