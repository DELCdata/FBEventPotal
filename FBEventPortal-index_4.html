:root{--bg:#F2F2F7;--surface:#fff;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.20);--sep:rgba(60,60,67,.14);--label:#1C1C1E;--label-2:rgba(60,60,67,.66);--label-3:rgba(60,60,67,.45);--grid:#ECECEF;

.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:980px){.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:520px){.g6{grid-template-columns:1fr 1fr}}
.tile .card-s{margin-bottom:4px}.tile .v{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* gauges */
.gauge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 16px 16px}
.gauge svg{width:100%;max-width:240px;height:auto;overflow:visible}
.g-val{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:-34px;font-variant-numeric:tabular-nums}
.g-lbl{font-size:15px;font-weight:600;margin-top:10px}
.g-sub{font-size:13px;color:var(--label-2);margin-top:2px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:980px;margin-top:10px}
.status.good{background:var(--good-bg);color:var(--good)}.status.bad{background:var(--bad-bg);color:var(--bad)}.status.flat{background:var(--fill);color:var(--label-2)}
/* status filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:none;background:var(--fill);color:var(--label);padding:8px 14px;border-radius:980px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.fchip b{font-variant-numeric:tabular-nums}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip.on{background:var(--navy);color:#fff}
/* tables */
table{font-size:14px}
th{font-size:12px;font-weight:600;color:var(--label-2);text-transform:none;letter-spacing:0;border-bottom:.5px solid var(--sep);padding:10px 12px}
td{border-bottom:.5px solid var(--sep);padding:12px;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(27,50,84,.035)}
tbody tr:last-child td{border-bottom:none}
.type-pill{border-radius:980px;font-size:11.5px;font-weight:600;padding:3px 10px;margin-bottom:0}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;font-variant-numeric:tabular-nums}
.ax{fill:var(--label-2);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--label-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:rgba(27,50,84,.05)}
#tip{position:fixed;z-index:600;pointer-events:none;background:rgba(28,28,30,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;min-width:150px;font-variant-numeric:tabular-nums}
#tip.on{opacity:1;transform:none}
#tip .tt{font-weight:600;margin-bottom:4px}
#tip .tr{display:flex;justify-content:space-between;gap:14px}
#tip .tr span:first-child{display:inline-flex;align-items:center;color:rgba(255,255,255,.8)}
#tip .sw{width:8px;height:8px;margin-right:6px}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.hbar .tr{height:14px;background:var(--grid);border-radius:980px;overflow:hidden}
.hbar .fl{height:100%;border-radius:980px;background:var(--s-a)}
/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-month{font-size:22px;font-weight:700;letter-spacing:-.02em;min-width:0;text-align:center;flex:0 1 230px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .dow{font-size:12px;font-weight:600;color:var(--label-2);text-align:center}
.day{background:var(--surface);border-radius:14px;min-height:112px;padding:8px 9px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;transition:transform .15s var(--ease),box-shadow .15s;border:1.5px solid transparent;text-align:left;font:inherit;color:inherit}
.day:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 10px 24px rgba(0,0,0,.08)}
.day.out{opacity:.38;box-shadow:none;background:transparent}
.day.has{background:linear-gradient(180deg,#FBF6EC 0,#fff 60%)}
.day.today{border-color:var(--gold)}
.day .dn{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.day .add{opacity:0;font-size:18px;line-height:1;color:var(--label-3);transition:opacity .15s}
.day:hover .add{opacity:1}
.chip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 7px;border-radius:7px;background:var(--fill);color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:none;font-family:inherit;cursor:pointer;width:100%;text-align:left}
.chip:hover{background:var(--fill-2)}
.chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip span{overflow:hidden;text-overflow:ellipsis}
.day .dsum{margin-top:auto;font-size:11.5px;color:var(--label-2);display:flex;justify-content:space-between}
.day .dsum b{font-weight:600}
@media(max-width:860px){.day{min-height:80px;padding:6px}.day .dsum{display:none}}
@media(max-width:700px){.cal-legend{display:none!important}.cal-month{font-size:18px;flex:1}}
@media(max-width:560px){.cal{gap:4px}.chip{font-size:0;padding:4px;justify-content:center}.chip i{width:8px;height:8px}.day{min-height:64px;border-radius:10px}}
/* event sheet */
#view-detail{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.sheet{background:var(--bg);border-radius:22px;width:100%;max-width:860px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:sheetIn .4s var(--ease)}
.sheet-top{position:sticky;top:0;z-index:2;background:rgba(242,242,247,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 20px 12px;border-bottom:.5px solid var(--sep)}
.sheet-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-title h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.xbtn{width:32px;height:32px;border-radius:50%;border:none;background:var(--fill);color:var(--label-2);cursor:pointer;font-size:14px;font-weight:700;flex-shrink:0}
.xbtn:hover{background:var(--fill-2)}
.sheet .sub-tab-bar{margin:12px 0 0}
.sheet-body{padding:18px 20px 10px}
.sheet-foot{position:sticky;bottom:0;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mini-tot{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--label-2);align-items:center}
.mini-tot b{color:var(--label);font-size:15px;font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.detail-block{background:var(--surface)}
.detail-row{font-size:14px}
/* edit form + data modal above the sheet */
.backdrop{z-index:300;align-items:center}
.modal{background:var(--bg);max-height:92vh;overflow-y:auto}
.modal-header{position:sticky;top:-20px;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin:-20px -22px 16px;padding:16px 22px 12px;z-index:2}
.form-grid .inp,.form-grid-3 .inp,.prow .inp,.vrow .inp,.offer-row .inp{background-color:#fff}
.section-head{border-top:none;margin-top:20px;padding-top:0}
.section-label{font-size:15px;font-weight:600;color:var(--label)}
.event-card{padding:16px}
.ec-actions .btn{font-size:12px;padding:7px 8px}
.toast{z-index:700}
#panel-overview td,#panel-overview th{white-space:nowrap}
.modal textarea.inp{background:#fff}
@media(max-width:760px){.nuser{display:none!important}.brand .bt,.nuser .un,.save-chip{display:none!important}.pt{font-size:28px}.seg button span{display:none}.seg button{padding:8px 11px}#nav-data-btn span,#nav-new-btn span{display:none}}

/* ── scheduling ── */
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sc-time{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sc-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sc-tile{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.sc-tile span{font-size:12.5px;color:var(--label-2);font-weight:500}.sc-tile b{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sc-tile.warn b{color:#b45309}.sc-tile.ok b{color:var(--green)}
.sc-seg{display:inline-flex;background:var(--fill);padding:3px;border-radius:11px;gap:2px;margin-bottom:12px;max-width:100%;overflow-x:auto}
.sc-seg button{border:none;background:transparent;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--label);cursor:pointer;font-family:inherit;white-space:nowrap}
.sc-seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sc-empty{text-align:center;padding:30px 20px}.sc-empty-t{font-size:17px;font-weight:600;margin-bottom:6px}
/* timeline */
.tl{padding:14px 16px 10px}
.tl-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--label-2);margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep)}.tl-key span{display:inline-flex;align-items:center;gap:6px}.tl-key i{width:16px;height:10px;border-radius:3px;display:inline-block}
.tl-row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;min-height:40px}
.tl-lab{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tl-lab b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab span{font-size:12px;color:var(--label-2);font-variant-numeric:tabular-nums}
.tl-track{position:relative;height:34px}
.tl-axis{min-height:24px}.tl-axis .tl-track{height:22px}
.tl-tick{position:absolute;top:2px;transform:translateX(-50%);font-size:11px;color:var(--label-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-evlab{position:absolute;top:2px;margin-left:6px;font-size:11px;font-weight:600;color:#9a7128;display:none}
.tl-gl{position:absolute;top:0;bottom:0;width:0;border-left:.5px solid var(--sep)}
.tl-band{position:absolute;top:0;bottom:0;background:rgba(201,151,58,.11);border-left:1.5px solid rgba(201,151,58,.55);border-right:1.5px solid rgba(201,151,58,.55)}
.tl-job{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:12px 0 2px;padding-top:10px;border-top:.5px solid var(--sep)}
.tl-job:first-of-type{border-top:none}
.tl-job i{width:10px;height:10px;border-radius:3px}.tl-job span{font-size:12px;font-weight:400;color:var(--label-2)}
.tl-bar{position:absolute;top:3px;bottom:3px;min-width:6px;border-radius:7px;background:color-mix(in srgb,var(--c) 16%,#fff);border-left:3px solid var(--c);display:flex;align-items:center;gap:6px;padding:0 8px;overflow:hidden;cursor:default}
.tl-bar.open{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,#fff) 0 8px,color-mix(in srgb,var(--c) 7%,#fff) 8px 16px)}
.tl-names{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label)}
.tl-names em{font-style:normal;color:var(--label-2)}
.tl-open{font-size:11px;font-weight:600;color:#b45309;white-space:nowrap;margin-left:auto}
.tl-none{position:absolute;top:9px;left:0;font-size:12px;color:var(--label-3)}
/* by person */
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pv{padding:16px}
.pv-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pv-av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0}
.pv-av.sm{width:28px;height:28px;font-size:11px}
.pv-n{font-size:15px;font-weight:600}
.pv-c{display:flex;flex-direction:column;font-size:12.5px;margin:-2px 0 8px 46px}.pv-c a{color:var(--navy);text-decoration:none}
.pv-item{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:start;padding:7px 0;border-top:.5px solid var(--sep);font-size:13px}
.pv-item i{width:8px;height:8px;border-radius:2px;margin-top:5px}
.pv-item b{font-weight:600;display:block}.pv-item span{font-size:12px;color:var(--label-2)}
.pv-t{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-t em{display:block;font-style:normal;color:#b45309;font-size:11.5px;font-weight:600}
/* open slots */
.ov-row{display:grid;grid-template-columns:8px 1fr auto 210px;gap:12px;align-items:center;padding:10px 0;border-top:.5px solid var(--sep)}
.ov-row:first-child{border-top:none}
.ov-row i{width:8px;height:28px;border-radius:3px}
.ov-what b{display:block;font-size:14px;font-weight:600}.ov-what span{display:block;font-size:12.5px;color:var(--label-2)}
.ov-need{font-size:12.5px;font-weight:600;color:#b45309;background:rgba(255,149,0,.12);padding:3px 10px;border-radius:980px;white-space:nowrap}
.ov-sel{padding:8px 10px;font-size:13.5px;background:#fff}
/* editor */
#sched-modal .modal{max-width:900px}
.sd-top{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin-bottom:8px}
.sd-top .inp{background:#fff}
.sd-hint{font-size:12.5px;color:var(--label-2);margin:4px 0 14px}
.sd-job{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--c)}
.sd-jh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sd-jh i{width:12px;height:12px;border-radius:4px;background:var(--c);flex-shrink:0}
.sd-jn{font-size:16px;font-weight:600;background:var(--fill)!important;flex:1}
.sd-th,.sd-task{display:grid;grid-template-columns:minmax(0,1fr) 132px 132px 64px 30px;gap:8px;align-items:center}
.sd-th{font-size:12px;color:var(--label-2);font-weight:500;padding:0 3px 4px}
.sd-task{padding:8px 0;border-top:.5px solid var(--sep)}
.sd-task .inp{background:#fff;padding:9px 10px;font-size:14px}
.sd-need{display:flex;align-items:center;gap:0;font-size:0}.sd-need .inp{text-align:center;padding:9px 4px}
.sd-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--fill);color:var(--label-2);cursor:pointer;font-size:15px;font-weight:600;flex-shrink:0;font-family:inherit}
.sd-x:hover{background:var(--fill-2);color:var(--label)}
.sd-people{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--c,#1a3355) 13%,#fff);color:var(--label);border-radius:980px;padding:4px 4px 4px 11px;font-size:13px;font-weight:500}
.pchip button{border:none;background:transparent;color:var(--label-2);cursor:pointer;font-size:15px;line-height:1;width:20px;height:20px;border-radius:50%}
.pchip button:hover{background:rgba(0,0,0,.08)}
.pchip.clash{background:rgba(255,149,0,.16);color:#8a4a06}
.pchip.openc{background:transparent;border:1.5px dashed #d4a35a;color:#b45309;padding:3px 10px;font-size:12px;font-weight:600}
.sd-task>*{min-width:0}
.sd-people{min-width:0}
.sd-pick{width:auto!important;min-width:140px;max-width:min(240px,100%);text-overflow:ellipsis;padding:6px 10px!important;font-size:13px!important;border-radius:980px!important;background:var(--fill)!important}
.sd-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}
.sd-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:.5px solid var(--sep)}
.tp-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-top:.5px solid var(--sep)}
.tp-row:first-of-type{border-top:none}
.sum-sched{cursor:pointer}
@media(max-width:700px){
  .sc-tiles{grid-template-columns:1fr 1fr}
  .tl-row{grid-template-columns:1fr;gap:2px;margin-bottom:6px}.tl-axis .tl-lab{display:none}
  .ov-row{grid-template-columns:8px 1fr;}.ov-need,.ov-sel{grid-column:2}
  .sd-top{grid-template-columns:1fr 1fr}
  .sd-th{display:none}.sd-task{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px 30px}#sched-modal .modal{padding:20px 14px}.sd-job{padding:12px}.sd-tn{grid-column:1/-1}
  .tp-row{grid-template-columns:1fr auto auto}.tp-row>.card-s{display:none}
}
#panel-volunteers td a{color:var(--navy);text-decoration:none;font-weight:500}#panel-volunteers td a:hover{text-decoration:underline}

@media print{body>*{display:none!important}#print-overlay{display:block!important;position:static!important;padding:.3in}}
</style>

<body>

<div id="login-screen">
  <div class="login-box" id="login-box">
    <div class="login-divider"></div>
    <div class="login-title">Food &amp; Beverage Portal</div>
    <div class="login-sub">Service &amp; Hospitality Team &middot; 2026</div>
    <div id="login-error" class="login-error" style="display:none"></div>

      <label class="lbl">Username</label>
      <input class="inp" id="login-user" placeholder="e.g. ddetrich" autocomplete="username">

    </div>

      <label class="lbl">Password</label>

    <button class="btn btn-primary" style="width:100%;padding:14px;font-size:16px;justify-content:center" onclick="doLogin()">Sign In</button>

      <a href="https://mydelc.org" target="_blank" style="font-size:11px;color:var(--muted);text-decoration:none">mydelc.org</a>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none;flex-direction:column;min-height:100vh">
  <div class="top-nav" id="top-nav">
    <span class="brand"><span class="dot">🍽</span><span class="bt">Food &amp; Beverage</span></span>
    <div class="seg" id="tabs"></div>
    <span class="nspacer"></span>
    <span class="save-chip" id="save-chip">&#9729; Auto-save on</span>
    <button class="nav-out" id="nav-data-btn" onclick="openData()" title="Data &amp; backups">&#128196;<span> Data</span></button>
    <button class="btn btn-gold btn-sm" id="nav-new-btn" onclick="openNewEvent()" style="padding:7px 14px">+<span> New event</span></button>
    <span class="nuser"><span class="avatar" id="nav-avatar"></span><span class="un" id="nav-user"></span></span>
    <button class="nav-out" onclick="doLogout()">Sign Out</button>
  </div>
  <div id="view-dash"><div id="wrap">
    <div id="panel-overview" class="panel"></div>
    <div id="panel-calendar" class="panel" style="display:none"></div>
    <div id="panel-events" class="panel" style="display:none"></div>
    <div id="panel-charts" class="panel" style="display:none"></div>
    <div id="panel-volunteers" class="panel" style="display:none"></div>
  </div></div>
</div>

<div id="view-detail" style="display:none" onclick="if(event.target===this)showDash()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-top">
      <div class="sheet-title"><div><h2 id="nav-title-text"></h2><div id="detail-meta" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px"></div></div><button class="xbtn" onclick="showDash()" aria-label="Close">✕</button></div>
      <div class="sub-tab-bar">
        <button class="sub-tab active" id="stab-summary" onclick="setDetailTab('summary')">Summary</button>

function eventToRow(e){
  return {
    id:e.id, name:e.name, date:e.date, type:e.type, status:e.status||"Scheduled", menu:e.menu||null,
    attendance:e.attendance||{adults:0,children:0,kidsMeals:0},
    financials:e.financials||{totalCost:0,totalOffering:0,totalIncome:0},
    purchases:e.purchases||[], offering:e.offering||emptyOffer(), volunteers:e.volunteers||[],
    start_time:e.startTime||null, end_time:e.endTime||null, jobs:e.jobs||[]
  };
}
function rowToEvent(r){
  return {
    id:r.id, name:r.name, date:r.date, type:r.type, status:r.status||"Scheduled", menu:r.menu||"",
    attendance:r.attendance||{adults:0,children:0,kidsMeals:0},
    financials:r.financials||{totalCost:0,totalOffering:0,totalIncome:0},
    purchases:r.purchases||[], offering:r.offering||emptyOffer(), volunteers:r.volunteers||[],
    startTime:r.start_time||"", endTime:r.end_time||"", jobs:Array.isArray(r.jobs)?r.jobs:[]
  };
}

async function loadBackupsOnly(){
  try{
    const {data,error}=await sb.from('backups').select('*').order('created_at',{ascending:false}).limit(10);
    if(error)throw error;
    backups=(data||[]).map(r=>({
      dbId:r.id,
      name:r.name,
      date:new Date(r.created_at).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}),
      eventCount:r.event_count,
      size:r.size_label,
      payload:JSON.stringify(r.payload)
    }));
  }catch(err){console.error("loadBackupsOnly",err);backups=[];}
}

async function loadAll(){
  if(!SUPABASE_CONFIGURED){
    showConfigError();
    events=JSON.parse(JSON.stringify(SEED));backups=[];
    return;
  }
  try{
    const {data,error}=await sb.from('events').select('*').order('date',{ascending:true});
    if(error)throw error;
    if(data&&data.length){
      events=data.map(rowToEvent);
    }else{
      events=JSON.parse(JSON.stringify(SEED));
      await saveAll();
    }
  }catch(err){
    console.error("loadAll",err);
    events=JSON.parse(JSON.stringify(SEED));
    setSaveStatus("error");
  }
  await loadRoster();
  await loadBackupsOnly();
}

async function saveAll(){
  setSaveStatus("saving");
  try{
    if(events.length){
      const {error:upErr}=await sb.from('events').upsert(events.map(eventToRow));
      if(upErr)throw upErr;
    }
    const {data:existingRows,error:selErr}=await sb.from('events').select('id');
    if(selErr)throw selErr;
    const localIds=new Set(events.map(e=>e.id));
    const toDelete=(existingRows||[]).map(r=>r.id).filter(id=>!localIds.has(id));
    if(toDelete.length){
      const {error:delErr}=await sb.from('events').delete().in('id',toDelete);
      if(delErr)throw delErr;
    }
    setSaveStatus("saved");setTimeout(()=>setSaveStatus("idle"),2000);
  }catch(err){
    console.error("saveAll",err);
    setSaveStatus("error");
  }
}

  err.innerHTML="Supabase isn't configured yet — edit this file and set <strong>SUPABASE_URL</strong> and <strong>SUPABASE_ANON_KEY</strong> near the top of the &lt;script&gt; tag.";

function setSaveStatus(s){
  const el=document.getElementById("save-chip");if(!el)return;
  const m={idle:["#aaa","&#9729; Auto-save on"],saving:["#d97706","&#8593; Saving…"],saved:[C.green,"&#10003; Saved"],error:[C.red,"&#10005; Error"]};
  const cfg=m[s]||m.idle;el.style.color=cfg[0];el.style.borderColor=cfg[0]+"44";el.innerHTML=cfg[1];
}

function doLogin(){
  const u=document.getElementById("login-user").value.trim().toLowerCase();
  const p=document.getElementById("login-pass").value;
  const err=document.getElementById("login-error");
  const box=document.getElementById("login-box");

  if(p!==PASS){err.textContent="Incorrect password. Please try again.";err.style.display="block";box.classList.add("shake");setTimeout(()=>box.classList.remove("shake"),500);return;}
  currentUsername=u;
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app-screen").style.display="flex";
  document.getElementById("nav-user").textContent=u;document.getElementById("nav-avatar").textContent=u.slice(0,2);
  setTab("overview");
}

  if(typeof DelcAuth!=="undefined")DelcAuth.clearSession();

  document.getElementById("login-error").style.display="none";
}

function gauge(frac,maxFrac,color,valText,label,sub,status){
  var cx=120,cy=118,r=96,sw=16;

  var ang=Math.PI*(1-1/maxFrac),ti=[cx+(r-sw/2-6)*Math.cos(ang),cy-(r-sw/2-6)*Math.sin(ang)],to=[cx+(r+sw/2+6)*Math.cos(ang),cy-(r+sw/2+6)*Math.sin(ang)];
  var f=Math.min(Math.max(frac,0),maxFrac);

    '<path d="'+arc(0,maxFrac)+'" fill="none" stroke="var(--grid)" stroke-width="'+sw+'" stroke-linecap="round"/>'+
    (f>0.002?'<path d="'+arc(0,f)+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round"/>':'')+
    (maxFrac>1?'<line x1="'+ti[0].toFixed(1)+'" y1="'+ti[1].toFixed(1)+'" x2="'+to[0].toFixed(1)+'" y2="'+to[1].toFixed(1)+'" stroke="var(--label)" stroke-width="2" stroke-linecap="round"/><text x="'+to[0].toFixed(1)+'" y="'+(to[1]-6).toFixed(1)+'" text-anchor="middle" class="ax" style="font-size:10px;font-weight:600">goal</text>':'')+
    '<text x="'+(cx-r)+'" y="'+(cy+16)+'" text-anchor="middle" class="ax">0</text><text x="'+(cx+r)+'" y="'+(cy+16)+'" text-anchor="middle" class="ax">'+Math.round(maxFrac*100)+'%</text>'+
    '</svg><div class="g-val">'+valText+'</div><div class="g-lbl">'+label+'</div><div class="g-sub">'+sub+'</div>'+(status||"")+'</div>';
}

// ── Pantry supplies dispensed to this event (HS Pantry app + Mug close-outs) ──
const _pnCache={};
async function pantryForEvent(id){
  const k=String(id);
  if(_pnCache[k]&&Date.now()-_pnCache[k].t<60000) return _pnCache[k].d;
  try{
    const {data,error}=await sb.from("pantry_dispenses").select("*").eq("event_id",k).order("date",{ascending:false});
    if(error) throw error;
    _pnCache[k]={t:Date.now(),d:data||[]};
    return data||[];
  }catch(err){ console.error("pantry",err); return []; }
}
const pnCost=d=>(d.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.unitCost||0),0);
const PN_LBL={kitchen:"Kitchen",mug:"Mug Pantry",hospitality:"Hospitality"};
function pantryHtml(ds,tot){
  const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  if(!ds.length) return `<p style="color:var(--muted);font-size:13px">No pantry supplies have been dispensed to this event yet.</p>
    <p class="pn-note">Supplies show up here when someone picks this event on the HS Pantry <em>Dispense</em> screen, or posts a Motivational Mug close-out to it.</p>
    <a class="btn" style="margin-top:12px" href="https://delcdata.github.io/HSPMugPantry/" target="_blank" rel="noopener">Open HS Pantry ↗</a>`;
  return ds.map(d=>`<div class="pn-group">
      <div class="pn-head"><span><strong>${new Date(d.date).toLocaleDateString()}</strong> · ${esc(d.operator||"")}${d.notes?" · "+esc(d.notes):""}</span><span>${fC(pnCost(d))}</span></div>
      <div style="overflow-x:auto"><table style="min-width:420px"><thead><tr><th>Item</th><th>Pantry</th><th class="r">Qty</th><th class="r">Unit cost</th><th class="r">Cost</th></tr></thead><tbody>
      ${(d.lines||[]).map(l=>`<tr><td><strong>${esc(l.name)}</strong>${l.brand?` <span style="color:var(--muted)">· ${esc(l.brand)}</span>`:""}${l.source?`<div style="font-size:11px;color:var(--muted)">${esc(l.source)}</div>`:""}</td><td>${esc(PN_LBL[l.pantry]||l.pantry||"")}</td><td class="r">${(+l.qty||0).toFixed(2)}</td><td class="r">${l.unitCost?fC(l.unitCost):"—"}</td><td class="r" style="font-weight:600">${l.unitCost?fC((+l.qty||0)*(+l.unitCost||0)):"—"}</td></tr>`).join("")}
      </tbody></table></div></div>`).join("")+
    `<div class="pn-total"><span>Total supplies from stock</span><strong>${fC(tot)}</strong></div>
     <p class="pn-note">This is the value of items taken from the church's existing stock. It is <em>not</em> added to the event's Total cost, since those items were usually paid for when they were bought.</p>`;
}

function saveForm(){
  if(!editingEvent.name.trim()){alert("Please enter an event name.");return;}
  const cost=calcCost(editingEvent);
  const offer=offerTotal(editingEvent.offering||emptyOffer());
  editingEvent.financials={totalCost:Math.round(cost*100)/100,totalOffering:Math.round(offer*100)/100,totalIncome:Math.round((offer-cost)*100)/100};
  const idx=events.findIndex(e=>e.id===editingEvent.id);
  if(idx>=0)events[idx]=editingEvent;else events.push(editingEvent);
  const savedId=editingEvent.id;
  closeForm();saveAll();
  if(currentEventId===savedId)showDetail(savedId);else{setTab(activeTab);}
  showToast("Event saved");
}

async function createBackup(){
  const payload={events};
  const now=new Date();
  const name="Backup "+now.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" "+now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
  const sizeLabel=fmtSz(JSON.stringify(payload));
  try{
    const {error}=await sb.from('backups').insert({name,event_count:events.length,size_label:sizeLabel,payload});
    if(error)throw error;
    const {data:rows}=await sb.from('backups').select('id').order('created_at',{ascending:false});
    if(rows&&rows.length>10){
      const idsToDelete=rows.slice(10).map(r=>r.id);
      await sb.from('backups').delete().in('id',idsToDelete);
    }
    await loadBackupsOnly();renderDataModal();showToast("Backup saved — "+events.length+" events");
  }catch(err){console.error("createBackup",err);showToast("Backup failed","err");}
}

function dlBackup(i){const blob=new Blob([backups[i].payload],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="delc_fb_backup_"+Date.now()+".json";a.click();}
async function delBackup(i){
  const b=backups[i];
  try{
    if(b.dbId!=null){const {error}=await sb.from('backups').delete().eq('id',b.dbId);if(error)throw error;}
    await loadBackupsOnly();renderDataModal();showToast("Backup deleted","err");
  }catch(err){console.error("delBackup",err);showToast("Delete failed","err");}
}
async function restoreBackup(i){
  if(!confirm('Restore "'+backups[i].name+'"? This replaces all current data.'))return;
  try{const d=JSON.parse(backups[i].payload);events=d.events||[];await saveAll();closeData();showDash();showToast("Restored from backup");}

}

function exportJSON(){
  const p=JSON.stringify({events,exportedAt:new Date().toISOString(),version:"1.0"},null,2);

function handleImport(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async e=>{
    try{const d=JSON.parse(e.target.result);if(!d.events||!Array.isArray(d.events))throw new Error();if(!confirm("Import "+d.events.length+" events? This replaces current data."))return;events=d.events;await saveAll();closeData();showDash();showToast("Imported "+d.events.length+" events");}
    catch{showToast("Import failed — check file format","err");}
  };

  r.readAsText(file);input.value="";
}

function handleDrop(e){
  e.preventDefault();document.getElementById("drop-zone").classList.remove("over");
  const file=e.dataTransfer.files[0];
  if(!file||!file.name.endsWith(".json")){showToast("Please drop a .json file","err");return;}
  const r=new FileReader();
  r.onload=async ev=>{
    try{const d=JSON.parse(ev.target.result);if(!d.events)throw new Error();if(!confirm("Import "+d.events.length+" events?"))return;events=d.events;await saveAll();closeData();showDash();showToast("Imported "+d.events.length+" events");}
    catch{showToast("Import failed","err");}
  };
  r.readAsText(file);
}

/* ═══════════════════ SCHEDULING: jobs → tasks → people ═══════════════════
   event.startTime / endTime  "HH:MM"
   event.jobs = [{id,name,color,tasks:[{id,name,start,end,needed,people:[volunteerId],notes}]}]
   fb_volunteers  = roster   ·   fb_job_templates = reusable jobs (times stored relative to event start) */
var VOLS=[],TEMPLATES=[],schedView="timeline",SD=null,SD_EVENT=null;
var JOB_COLORS=["#3466B0","#B8862A","#1B9A72","#8B5CC4"];
var JOB_PRESETS=["Setup","Kitchen","Hospitality","Serving","Cleanup"];
function sUid(){return Math.random().toString(36).slice(2,10);}
function tMin(t){if(!t||!/^\d{1,2}:\d{2}/.test(t))return null;var p=t.split(":");return (+p[0])*60+(+p[1]);}
function mT(m){m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function fT(t,noAmPm){var m=tMin(t);if(m==null)return "";var h=Math.floor(m/60),mm=m%60;return ((h%12)||12)+":"+String(mm).padStart(2,"0")+(noAmPm?"":(h<12?" AM":" PM"));}
function fTR(a,b){if(tMin(a)==null&&tMin(b)==null)return "Time not set";if(tMin(b)==null)return fT(a);if(tMin(a)==null)return "until "+fT(b);
  var same=(tMin(a)<720)===(tMin(b)<720);return fT(a,same)+" – "+fT(b);}
function volById(id){for(var i=0;i<VOLS.length;i++)if(VOLS[i].id===id)return VOLS[i];return null;}
function volName(id){var v=volById(id);return v?v.name:"(removed)";}
function initials(n){return String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase();}
function jobColor(j,i){return j.color||JOB_COLORS[i%JOB_COLORS.length];}
function evJobs(e){return (e&&e.jobs)||[];}

/* ── database ── */
async function loadRoster(){
  try{var r=await sb.from("fb_volunteers").select("*").order("name");if(r.error)throw r.error;VOLS=r.data||[];}catch(err){console.error("loadRoster",err);VOLS=[];}
  try{var t=await sb.from("fb_job_templates").select("*").order("name");if(t.error)throw t.error;TEMPLATES=t.data||[];}catch(err){console.error("loadTemplates",err);TEMPLATES=[];}
}
async function saveVol(v){v.updated_at=new Date().toISOString();var r=await sb.from("fb_volunteers").upsert(v);if(r.error){console.error(r.error);showToast("Couldn't save volunteer","err");return false;}return true;}
async function saveTemplate(t){t.updated_at=new Date().toISOString();t.updated_by=currentUsername||null;var r=await sb.from("fb_job_templates").upsert(t);if(r.error){console.error(r.error);showToast("Couldn't save template","err");return false;}return true;}

/* ── stats + conflicts ── */
function schedStats(e){
  var s={jobs:evJobs(e).length,tasks:0,needed:0,have:0,open:0,people:{}};
  evJobs(e).forEach(function(j){j.tasks.forEach(function(t){s.tasks++;var h=(t.people||[]).length,nd=+t.needed||0;s.have+=h;s.needed+=Math.max(nd,h);s.open+=Math.max(0,nd-h);(t.people||[]).forEach(function(p){s.people[p]=1;});});});
  s.peopleCount=Object.keys(s.people).length;return s;
}
function overlaps(a1,a2,b1,b2){var x1=tMin(a1),x2=tMin(a2),y1=tMin(b1),y2=tMin(b2);if(x1==null||y1==null)return false;if(x2==null)x2=x1+30;if(y2==null)y2=y1+30;return x1<y2&&y1<x2;}
/* every place this volunteer is booked on a date: [{ev,job,task}] */
function bookings(volId,date,jobsOverride,evIdOverride){
  var out=[];
  events.forEach(function(ev){if(ev.date!==date)return;var js=(ev.id===evIdOverride&&jobsOverride)?jobsOverride:evJobs(ev);
    js.forEach(function(j){j.tasks.forEach(function(t){if((t.people||[]).indexOf(volId)>=0)out.push({ev:ev,job:j,task:t});});});});
  if(evIdOverride!=null&&!events.some(function(ev){return ev.id===evIdOverride;})&&jobsOverride)
    jobsOverride.forEach(function(j){j.tasks.forEach(function(t){if((t.people||[]).indexOf(volId)>=0)out.push({ev:{id:evIdOverride,name:"this event"},job:j,task:t});});});
  return out;
}
/* conflicts for one person on one task: other bookings that overlap in time */
function clashes(volId,task,date,jobs,evId){
  return bookings(volId,date,jobs,evId).filter(function(b){return b.task.id!==task.id&&overlaps(task.start,task.end,b.task.start,b.task.end);});
}
function clashText(c){return c.map(function(b){return b.task.name+" ("+fTR(b.task.start,b.task.end)+(b.ev.id!==SD_EVENT&&b.ev.id!==currentEventId?" · "+b.ev.name:"")+")";}).join(", ");}

/* timeline */
function tlRange(e){
  var lo=Infinity,hi=-Infinity;function add(a,b){var x=tMin(a),y=tMin(b);if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,y!=null?y:x+30);}}
  add(e.startTime,e.endTime);evJobs(e).forEach(function(j){j.tasks.forEach(function(t){add(t.start,t.end);});});
  if(lo===Infinity)return null;lo=Math.floor(lo/60)*60;hi=Math.ceil(hi/60)*60;if(hi-lo<120)hi=lo+120;return [lo,hi];
}
function timelineView(e){
  var R=tlRange(e);if(!R)return '<div class="card card-s">Add start and end times to tasks to see them on a timeline.</div>';
  var lo=R[0],hi=R[1],span=hi-lo,pct=function(m){return ((m-lo)/span*100).toFixed(3)+"%";};
  var step=span>480?120:60,ticks="",grid="";
  for(var m=lo;m<=hi;m+=step){ticks+='<span class="tl-tick" style="left:'+pct(m)+'">'+fT(mT(m)).replace(":00","")+'</span>';grid+='<i class="tl-gl" style="left:'+pct(m)+'"></i>';}
  var band="";if(tMin(e.startTime)!=null){var es=tMin(e.startTime),ee=tMin(e.endTime);if(ee==null)ee=es+60;band='<i class="tl-band" style="left:'+pct(es)+';width:calc('+pct(ee)+' - '+pct(es)+')"></i>';}
  var rows='<div class="tl-row tl-axis"><div class="tl-lab"></div><div class="tl-track">'+ticks+(band?'<span class="tl-evlab" style="left:'+pct(tMin(e.startTime))+'">Event</span>':'')+'</div></div>';
  evJobs(e).forEach(function(j,ji){
    var col=jobColor(j,ji);
    rows+='<div class="tl-job"><i style="background:'+col+'"></i>'+hEsc(j.name||"Job")+'<span>'+j.tasks.length+' task'+(j.tasks.length===1?'':'s')+'</span></div>';
    j.tasks.slice().sort(function(a,b){return (tMin(a.start)||0)-(tMin(b.start)||0);}).forEach(function(t){
      var ppl=(t.people||[]),open=Math.max(0,(+t.needed||0)-ppl.length),names=ppl.map(volName);
      var x=tMin(t.start),y=tMin(t.end);
      var bar;
      if(x==null){bar='<span class="tl-none">Time not set</span>';}
      else{if(y==null||y<=x)y=x+30;
        var tip=tipHtml(t.name||"Task",[["Time",fTR(t.start,t.end),col]].concat(names.map(function(n){return ["",n];})).concat(open?[["Open",open+" more needed"]]:[]));
        bar='<div class="tl-bar'+(open?' open':'')+'" style="left:'+pct(x)+';width:calc('+pct(y)+' - '+pct(x)+');--c:'+col+'" data-tip="'+hEsc(tip)+'">'+
          '<span class="tl-names">'+(names.length?hEsc(names.join(", ")):'<em>Nobody yet</em>')+'</span>'+(open?'<span class="tl-open">+'+open+' open</span>':'')+'</div>';}
      rows+='<div class="tl-row"><div class="tl-lab"><b>'+hEsc(t.name||"Task")+'</b><span>'+hEsc(fTR(t.start,t.end))+' · '+ppl.length+(+t.needed?'/'+(+t.needed):'')+'</span></div><div class="tl-track">'+grid+band+bar+'</div></div>';
    });
  });
  var key='<div class="tl-key">'+(band?'<span><i style="background:rgba(201,151,58,.18);border:1.5px solid rgba(201,151,58,.55)"></i>Event time</span>':'')+'<span><i style="background:repeating-linear-gradient(135deg,#e5e5ea 0 4px,#f5f5f7 4px 8px)"></i>Still needs people</span><span>Hover a bar for names</span></div>';
  return '<div class="card tl">'+rows+key+'</div>';
}

/* by person */
function personRows(e){
  var map={};
  evJobs(e).forEach(function(j,ji){j.tasks.forEach(function(t){(t.people||[]).forEach(function(p){(map[p]=map[p]||[]).push({job:j,ji:ji,task:t});});});});
  return Object.keys(map).map(function(id){var list=map[id].sort(function(a,b){return (tMin(a.task.start)||0)-(tMin(b.task.start)||0);});
    var st=list.map(function(x){return tMin(x.task.start);}).filter(function(v){return v!=null;}),en=list.map(function(x){return tMin(x.task.end)!=null?tMin(x.task.end):tMin(x.task.start);}).filter(function(v){return v!=null;});
    return {id:id,vol:volById(id),name:volName(id),list:list,first:st.length?Math.min.apply(null,st):null,last:en.length?Math.max.apply(null,en):null};})
   .sort(function(a,b){return (a.first==null?9999:a.first)-(b.first==null?9999:b.first)||a.name.localeCompare(b.name);});
}
function personView(e){
  var ps=personRows(e);if(!ps.length)return '<div class="card card-s">Nobody is assigned yet. Use Open slots or Edit schedule to add people.</div>';

    var v=p.vol||{},cl=0;

      return '<div class="pv-item"><i style="background:'+jobColor(x.job,x.ji)+'"></i><div><b>'+hEsc(x.task.name||"Task")+'</b><span>'+hEsc(x.job.name||"Job")+'</span></div><div class="pv-t">'+hEsc(fTR(x.task.start,x.task.end))+(c.length?'<em title="'+hEsc("Overlaps: "+clashText(c))+'">⚠ overlap</em>':'')+'</div></div>';}).join("");
    return '<div class="card pv"><div class="pv-h"><span class="pv-av">'+hEsc(initials(p.name))+'</span><div style="min-width:0"><div class="pv-n">'+hEsc(p.name)+'</div><div class="card-s">'+(p.first!=null?"On site "+fTR(mT(p.first),mT(p.last)):"Times not set")+'</div></div></div>'+
      ((v.phone||v.email)?'<div class="pv-c">'+(v.phone?'<a href="tel:'+hEsc(v.phone)+'">'+hEsc(v.phone)+'</a>':'')+(v.email?'<a href="mailto:'+hEsc(v.email)+'">'+hEsc(v.email)+'</a>':'')+'</div>':'')+items+'</div>';}).join("")+'</div>';
}

/* open slots with quick assign */
function volOptions(task,date,jobs,evId,exclude){

async function quickAssign(evId,jobId,taskId,volId){
  if(!volId)return;var e=events.find(function(x){return x.id===evId;});if(!e)return;
  if(volId==="__new"){var v=await newVolunteerPrompt();if(!v){renderDetailContent(e);return;}volId=v.id;}
  e.jobs.forEach(function(j){if(j.id!==jobId)return;j.tasks.forEach(function(t){if(t.id===taskId&&t.people.indexOf(volId)<0)t.people.push(volId);});});
  saveAll();renderDetailContent(e);showToast(volName(volId)+" scheduled");
}
async function newVolunteerPrompt(){

  if(!(await saveVol(v)))return null;VOLS.push(v);VOLS.sort(function(a,b){return a.name.localeCompare(b.name);});return v;
}

function sdAddJob(name){var i=SD.jobs.length;SD.jobs.push({id:"j"+sUid(),name:name||"",color:JOB_COLORS[i%JOB_COLORS.length],tasks:[]});sdAddTask(i,true);}

function sdDelTask(j,t){SD.jobs[j].tasks.splice(t,1);renderSchedEditor();}
async function sdAddPerson(j,t,val){

      var open=Math.max(0,(+t.needed||0)-(t.people||[]).length);
      return '<div class="sd-task">'+
        '<input class="inp sd-tn" id="sd-tn-'+ji+'-'+ti+'" value="'+hEsc(t.name)+'" placeholder="Task (e.g. Prep casserole)" onchange="sdSet('+ji+','+ti+',\'name\',this.value)">'+
        '<input class="inp sd-tt" type="time" value="'+hEsc(t.start)+'" onchange="sdSet('+ji+','+ti+',\'start\',this.value,1)" aria-label="Start">'+
        '<input class="inp sd-tt" type="time" value="'+hEsc(t.end)+'" onchange="sdSet('+ji+','+ti+',\'end\',this.value,1)" aria-label="End">'+
        '<label class="sd-need">Need<input class="inp" type="number" min="0" value="'+(+t.needed||0)+'" onchange="sdSet('+ji+','+ti+',\'needed\',parseInt(this.value)||0,1)"></label>'+
        '<button class="sd-x" onclick="sdDelTask('+ji+','+ti+')" aria-label="Remove task">×</button>'+
        '<div class="sd-people">'+chips+(open?'<span class="pchip openc">'+open+' open</span>':'')+
          '<select class="inp sd-pick" onchange="sdAddPerson('+ji+','+ti+',this.value)"><option value="">+ Add person</option>'+volOptions(t,e.date,SD.jobs,SD_EVENT,t.people)+'<option value="__new">+ New volunteer…</option></select></div>'+
      '</div>';}).join("");
    return '<div class="sd-job" style="--c:'+col+'"><div class="sd-jh"><i></i><input class="inp sd-jn" value="'+hEsc(j.name)+'" placeholder="Job name (e.g. Kitchen)" onchange="sdSet('+ji+',null,\'name\',this.value)">'+

function saveSchedule(){
  var e=events.find(function(x){return x.id===SD_EVENT;});if(!e)return;
  SD.jobs.forEach(function(j,ji){if(!j.name.trim())j.name="Job "+(ji+1);j.tasks=j.tasks.filter(function(t){return t.name.trim()||t.people.length||t.start;});j.tasks.forEach(function(t,ti){if(!t.name.trim())t.name="Task "+(ti+1);});});
  e.startTime=SD.startTime;e.endTime=SD.endTime;e.jobs=SD.jobs;
  closeSchedEditor();saveAll();if(currentEventId===e.id){activeDetailTab="schedule";renderDetail(e);}showToast("Schedule saved");
}
/* templates: times saved as minutes from the event start so they shift with each event */
async function saveAsTemplate(){
  var base=tMin(SD.startTime);
  if(base==null){var all=[];SD.jobs.forEach(function(j){j.tasks.forEach(function(t){if(tMin(t.start)!=null)all.push(tMin(t.start));});});base=all.length?Math.min.apply(null,all):null;}
  var e=events.find(function(x){return x.id===SD_EVENT;});
  var name=prompt("Template name",(e&&e.type?e.type+" ":"")+"schedule");if(!name||!name.trim())return;name=name.trim();
  var ex=TEMPLATES.find(function(t){return t.name.toLowerCase()===name.toLowerCase();});
  if(ex&&!confirm("Replace the existing “"+ex.name+"” template?"))return;
  var off=function(t){var m=tMin(t);return m==null||base==null?null:m-base;};
  var body={baseStart:base==null?null:mT(base),baseEnd:SD.endTime||null,endOff:off(SD.endTime),
    jobs:SD.jobs.map(function(j){return {name:j.name,color:j.color,tasks:j.tasks.map(function(t){return {name:t.name,startOff:off(t.start),endOff:off(t.end),needed:+t.needed||0,notes:t.notes||""};})};})};
  var tpl={id:ex?ex.id:"tpl"+sUid(),name:name,jobs:body};
  if(!(await saveTemplate(tpl)))return;
  if(ex)Object.assign(ex,tpl);else TEMPLATES.push(tpl);TEMPLATES.sort(function(a,b){return a.name.localeCompare(b.name);});
  renderSchedEditor();showToast("Template “"+name+"” saved");
}
function applyTemplate(id){
  var tpl=TEMPLATES.find(function(t){return t.id===id;});if(!tpl)return;var b=tpl.jobs||{};
  if(!SD.startTime&&b.baseStart){SD.startTime=b.baseStart;if(b.endOff!=null)SD.endTime=mT(tMin(b.baseStart)+b.endOff);}
  var base=tMin(SD.startTime)!=null?tMin(SD.startTime):tMin(b.baseStart);
  var at=function(o){return o==null||base==null?"":mT(base+o);};
  (b.jobs||[]).forEach(function(j){var i=SD.jobs.length;SD.jobs.push({id:"j"+sUid(),name:j.name,color:j.color||JOB_COLORS[i%JOB_COLORS.length],
    tasks:j.tasks.map(function(t){return {id:"t"+sUid(),name:t.name,start:at(t.startOff),end:at(t.endOff),needed:t.needed||0,people:[],notes:t.notes||""};})});});
  renderSchedEditor();showToast("Added “"+tpl.name+"” — now pick people");
}

function schedPrintCss(){return '<style>#print-overlay *{box-sizing:border-box}#print-overlay{font-family:"Helvetica Neue",Arial,sans-serif;color:#1a1a1a;font-size:10.5pt;background:#fff}'+
  '#print-overlay .sp-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1a3355;padding-bottom:10px;margin-bottom:14px}'+
  '#print-overlay .sp-org{font-size:9pt;color:#7a6a55;font-weight:700}#print-overlay .sp-t{font-size:20pt;font-weight:900;color:#1a3355;line-height:1.1}#print-overlay .sp-m{font-size:11pt;margin-top:3px}'+
  '#print-overlay .sp-sum{font-size:9.5pt;color:#555;text-align:right;line-height:1.5}'+
  '#print-overlay h3{font-size:12pt;margin:14px 0 6px;color:#1a3355;display:flex;align-items:center;gap:8px}#print-overlay h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}'+
  '#print-overlay table{width:100%;border-collapse:collapse}#print-overlay th{text-align:left;font-size:8pt;color:#7a6a55;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid #1a3355;padding:4px 6px}'+
  '#print-overlay td{padding:6px;border-bottom:1px solid #e4d8c8;vertical-align:top}#print-overlay tr{page-break-inside:avoid}'+
  '#print-overlay .ck{display:inline-block;margin:0 14px 3px 0;white-space:nowrap}#print-overlay .ck:before{content:"";display:inline-block;width:11px;height:11px;border:1.3px solid #1a1a1a;border-radius:2px;margin-right:5px;vertical-align:-1px}'+
  '#print-overlay .blank{color:#999}#print-overlay .tm{white-space:nowrap;width:1%}#print-overlay .jt{table-layout:fixed}#print-overlay .jt td:first-child,#print-overlay .jt th:first-child{width:22%}#print-overlay .jt td:nth-child(2),#print-overlay .jt th:nth-child(2){width:28%}'+
  '#print-overlay .rf{margin-top:18px;padding-top:8px;border-top:1px solid #e4d8c8;font-size:8pt;color:#7a6a55;display:flex;justify-content:space-between}'+
  '#print-overlay .close-btn{position:fixed;top:16px;right:20px;background:#1a3355;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;z-index:10000}'+
  '@media print{#print-overlay .close-btn{display:none}}</style>';}
function schedTablesHtml(e,withCheck){
  return evJobs(e).map(function(j,ji){
    var rows=j.tasks.slice().sort(function(a,b){return (tMin(a.start)||0)-(tMin(b.start)||0);}).map(function(t){
      var open=Math.max(0,(+t.needed||0)-(t.people||[]).length);
      var ppl=(t.people||[]).map(function(p){return withCheck?'<span class="ck">'+hEsc(volName(p))+'</span>':hEsc(volName(p));}).join(withCheck?"":", ");
      for(var k=0;k<open;k++)ppl+=withCheck?'<span class="ck blank">________________</span>':(ppl?", ":"")+'<span class="blank">open</span>';
      return '<tr><td class="tm">'+hEsc(fTR(t.start,t.end))+'</td><td><b>'+hEsc(t.name)+'</b>'+(t.notes?'<br><span style="color:#666;font-size:9pt">'+hEsc(t.notes)+'</span>':'')+'</td><td>'+(ppl||'<span class="blank">—</span>')+'</td></tr>';}).join("");
    return '<h3><i style="background:'+jobColor(j,ji)+'"></i>'+hEsc(j.name)+'</h3><table class="jt"><thead><tr><th>Time</th><th>Task</th><th>'+(withCheck?'Check in':'Volunteers')+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }).join("");
}
function printSchedule(id){
  var e=events.find(function(x){return x.id===id;});if(!e)return;var s=schedStats(e),ps=personRows(e);
  var people=ps.length?'<h3>By person</h3><table><thead><tr><th>Name</th><th>Phone</th><th>On site</th><th>Tasks</th></tr></thead><tbody>'+ps.map(function(p){var v=p.vol||{};return '<tr><td><b>'+hEsc(p.name)+'</b></td><td class="tm">'+hEsc(v.phone||"")+'</td><td class="tm">'+(p.first!=null?hEsc(fTR(mT(p.first),mT(p.last))):"")+'</td><td>'+p.list.map(function(x){return hEsc(fT(x.task.start)+" "+x.task.name);}).join("; ")+'</td></tr>';}).join("")+'</tbody></table>':"";
  var ov=document.getElementById("print-overlay");
  ov.innerHTML=schedPrintCss()+'<button class="close-btn" onclick="closePrintOverlay()">✕ Close</button>'+
    '<div class="sp-h"><div><div class="sp-org">Duncansville Evangelical Lutheran Church · Food &amp; Beverage</div><div class="sp-t">'+hEsc(e.name)+' — Volunteer Schedule</div>'+
    '<div class="sp-m">'+hEsc(new Date(e.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}))+(e.startTime?' · Event '+hEsc(fTR(e.startTime,e.endTime)):'')+'</div></div>'+
    '<div class="sp-sum">'+s.peopleCount+' volunteers · '+s.tasks+' tasks'+(s.open?'<br><b style="color:#b91c1c">'+s.open+' open slot'+(s.open>1?'s':'')+'</b>':'')+'</div></div>'+
    schedTablesHtml(e,true)+people+
    '<div class="rf"><span>DELC Food &amp; Beverage — '+hEsc(e.name)+'</span><span>Printed '+new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+'</span></div>';
  ov.style.display="block";document.body.style.overflow="hidden";setTimeout(function(){window.print();},300);
}

/* ═════ Volunteers tab: roster + templates ═════ */
var volSearch="";
function upcomingFor(id){var t=isoOf(new Date()),out=[];events.forEach(function(e){if(e.date<t)return;evJobs(e).forEach(function(j){j.tasks.forEach(function(k){if((k.people||[]).indexOf(id)>=0)out.push({e:e,t:k});});});});return out.sort(function(a,b){return a.e.date<b.e.date?-1:a.e.date>b.e.date?1:(tMin(a.t.start)||0)-(tMin(b.t.start)||0);});}
function renderVolunteers(){
  var el=document.getElementById("panel-volunteers");
  var list=VOLS.filter(function(v){return !volSearch||(v.name+" "+(v.phone||"")+" "+(v.email||"")).toLowerCase().indexOf(volSearch.toLowerCase())>=0;});
  var rows=list.map(function(v){var up=upcomingFor(v.id),nx=up[0];
    return '<tr'+(v.active===false?' style="opacity:.5"':'')+'><td><div style="display:flex;align-items:center;gap:10px"><span class="pv-av sm">'+hEsc(initials(v.name))+'</span><b>'+hEsc(v.name)+'</b></div></td><td>'+hEsc(v.phone||"")+'</td><td>'+hEsc(v.email||"")+'</td><td class="num">'+up.length+'</td><td>'+(nx?'<a href="#" onclick="showDetail('+nx.e.id+');activeDetailTab=\'schedule\';renderDetail(events.find(function(x){return x.id==='+nx.e.id+'}));return false">'+hEsc(fD(nx.e.date).replace(/, \d{4}$/,""))+' · '+hEsc(nx.t.name)+'</a>':'<span style="color:var(--label-3)">—</span>')+'</td><td style="text-align:right"><button class="btn btn-sm" onclick="editVol(\''+v.id+'\')">Edit</button></td></tr>';}).join("");
  var tpls=TEMPLATES.map(function(t){var b=t.jobs||{},js=b.jobs||[],n=js.reduce(function(s,j){return s+j.tasks.length;},0);
    return '<div class="tp-row"><div style="min-width:0"><b>'+hEsc(t.name)+'</b><div class="card-s">'+js.map(function(j){return hEsc(j.name)+" ("+j.tasks.length+")";}).join(" · ")+(b.baseStart?' · starts '+hEsc(fT(b.baseStart)):'')+'</div></div><span class="card-s">'+n+' task'+(n===1?'':'s')+'</span><button class="btn btn-sm" onclick="renameTemplate(\''+t.id+'\')">Rename</button><button class="btn btn-sm btn-danger" onclick="deleteTemplate(\''+t.id+'\')">Delete</button></div>';}).join("");
  el.innerHTML='<div class="ph"><div><div class="eyebrow">Roster &amp; job templates</div><div class="pt">Volunteers</div></div><div class="fr"><input class="inp" style="width:220px" placeholder="Search" value="'+hEsc(volSearch)+'" oninput="volSearch=this.value;renderVolunteers();var i=document.querySelector(\'#panel-volunteers .ph input\');i.focus();i.setSelectionRange(i.value.length,i.value.length)"><button class="btn btn-gold" onclick="editVol(null)">+ Add volunteer</button></div></div>'+
    '<div class="card" style="margin-bottom:16px"><div class="card-h"><div class="card-t">Roster</div><div class="card-s">'+VOLS.filter(function(v){return v.active!==false;}).length+' active</div></div><div style="overflow-x:auto"><table style="width:100%;min-width:620px"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Upcoming</th><th>Next shift</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="card-s">No volunteers match.</td></tr>')+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-h"><div class="card-t">Job templates</div><div class="card-s">Build a schedule on an event, then “Save as template” to reuse it</div></div>'+(tpls||'<div class="card-s">No templates yet.</div>')+'</div>';
}
function editVol(id){
  var v=id?Object.assign({},volById(id)):{id:"v"+sUid(),name:"",phone:"",email:"",teams:"",notes:"",active:true};
  window._ev=v;
  document.getElementById("sched-inner").innerHTML='<div class="modal-header"><div><div class="modal-eyebrow">Volunteer roster</div><h2 class="modal-title">'+(id?"Edit volunteer":"New volunteer")+'</h2></div><button class="xbtn" onclick="closeSchedEditor()">✕</button></div>'+
    '<div class="form-grid"><div style="grid-column:span 2"><label class="lbl">Name</label><input class="inp" id="vf-name" value="'+hEsc(v.name)+'" oninput="_ev.name=this.value"></div>'+
    '<div><label class="lbl">Phone</label><input class="inp" type="tel" value="'+hEsc(v.phone||"")+'" oninput="_ev.phone=this.value"></div>'+
    '<div><label class="lbl">Email</label><input class="inp" type="email" value="'+hEsc(v.email||"")+'" oninput="_ev.email=this.value"></div>'+
    '<div style="grid-column:span 2"><label class="lbl">Notes (skills, availability, allergies…)</label><textarea class="inp" style="min-height:60px;background:#fff" oninput="_ev.notes=this.value">'+hEsc(v.notes||"")+'</textarea></div>'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox"'+(v.active!==false?' checked':'')+' onchange="_ev.active=this.checked"> Active (shows in pickers)</label></div>'+
    '<div class="sd-foot"><button class="btn" onclick="closeSchedEditor()">Cancel</button><button class="btn btn-primary" onclick="saveVolForm()">&#10003; Save</button></div>';
  document.getElementById("sched-modal").style.display="flex";setTimeout(function(){document.getElementById("vf-name").focus();},30);
}
async function saveVolForm(){
  var v=window._ev;if(!v.name.trim()){alert("Please enter a name.");return;}v.name=v.name.trim();
  if(!(await saveVol(v)))return;var i=VOLS.findIndex(function(x){return x.id===v.id;});if(i>=0)VOLS[i]=v;else VOLS.push(v);
  VOLS.sort(function(a,b){return a.name.localeCompare(b.name);});closeSchedEditor();renderVolunteers();showToast("Saved "+v.name);
}
async function renameTemplate(id){var t=TEMPLATES.find(function(x){return x.id===id;});var n=prompt("Template name",t.name);if(!n||!n.trim())return;t.name=n.trim();if(await saveTemplate(t))renderVolunteers();}
async function deleteTemplate(id){var t=TEMPLATES.find(function(x){return x.id===id;});if(!confirm("Delete the “"+t.name+"” template? Events already scheduled from it keep their jobs."))return;
  var r=await sb.from("fb_job_templates").delete().eq("id",id);if(r.error){showToast("Couldn't delete","err");return;}TEMPLATES=TEMPLATES.filter(function(x){return x.id!==id;});renderVolunteers();}

(async function(){
  const ssoSession=(typeof DelcAuth!=="undefined")?DelcAuth.getSession():null;
  if(ssoSession&&DelcAuth.hasAppAccess(ssoSession,"fb")){
    currentUsername=ssoSession.username;
    document.getElementById("login-screen").style.display="none";
    document.getElementById("app-screen").style.display="flex";
    document.getElementById("nav-user").textContent=ssoSession.username;document.getElementById("nav-avatar").textContent=ssoSession.username.slice(0,2);
  }
  await loadAll();
  setTab("overview");
})();
</script>
